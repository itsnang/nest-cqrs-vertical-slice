version: "3.8"

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - local
    volumes:
      - nest_cqrs_data:/var/lib/postgresql/data

networks:
  local:

volumes:
  nest_cqrs_data:
