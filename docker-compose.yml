version: "3.8"

services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DBNAME}
    networks:
      - local

    volumes:
      - ./data/${PG_DBNAME}:/var/lib/postgresql/data

networks:
  local:
